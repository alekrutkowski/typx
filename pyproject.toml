[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "typx"
version = "0.1.0"
description = "Bidirectional static converter between Typst and DOCX with exact round-trip preservation"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [
  {name = "Alek Rutkowski", email = "alek.rutkowski@gmail.com"}
]
keywords = ["typst", "docx", "ooxml", "wordprocessingml", "converter", "transpiler"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows :: Windows 11",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Office/Business :: Office Suites",
  "Topic :: Text Processing :: Markup",
]
dependencies = []

[project.scripts]
typx = "typx.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
