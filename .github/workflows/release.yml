name: Release

on:
  workflow_call:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish rolling release
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          check-latest: false

      - name: Check version metadata
        run: python scripts/check_version.py

      - name: Read package version
        id: version
        shell: bash
        run: echo "version=$(python scripts/check_version.py --print-version)" >> "$GITHUB_OUTPUT"

      - name: Build release artifacts
        run: python scripts/build_release.py

      - name: Verify release artifacts
        run: python scripts/verify_release.py

      - name: Record first reproducibility manifest
        run: cp dist/SHA256SUMS.txt /tmp/SHA256SUMS.first.txt

      - name: Rebuild from the same checkout
        run: python scripts/build_release.py

      - name: Verify deterministic hash
        run: diff -u /tmp/SHA256SUMS.first.txt dist/SHA256SUMS.txt

      - name: Smoke-test rolling zip application
        run: |
          python dist/typx.pyz --version
          python dist/typx.pyz mapping --query equation --format json > /tmp/mapping.json

      - name: Upload publication artifact
        uses: actions/upload-artifact@v7
        with:
          name: typx-published-${{ github.sha }}
          path: |
            dist/typx.pyz
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Check that this commit is still main HEAD
        id: current
        shell: bash
        run: |
          git fetch origin main
          if [ "$(git rev-parse origin/main)" = "$GITHUB_SHA" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "A newer main commit exists; this rolling release update is superseded."
          fi

      - name: Move rolling release tag to this commit
        if: steps.current.outputs.publish == 'true'
        shell: bash
        run: |
          git tag --force continuous "$GITHUB_SHA"
          git push origin refs/tags/continuous --force

      - name: Remove obsolete rolling release assets
        if: steps.current.outputs.publish == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const allowed = new Set(["typx.pyz", "SHA256SUMS.txt"]);
            let release;
            try {
              release = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: "continuous",
              });
            } catch (error) {
              if (error.status === 404) {
                core.info("No existing continuous release yet; nothing to clean.");
                return;
              }
              throw error;
            }

            for (const asset of release.data.assets) {
              if (!allowed.has(asset.name)) {
                core.info(`Deleting obsolete release asset: ${asset.name}`);
                await github.rest.repos.deleteReleaseAsset({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  asset_id: asset.id,
                });
              }
            }

      - name: Publish rolling GitHub Release
        if: steps.current.outputs.publish == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: continuous
          target_commitish: ${{ github.sha }}
          name: Latest main build
          body: |
            Automatically rebuilt from the latest successful `main` commit.

            Commit: `${{ github.sha }}`
            Package version: `${{ steps.version.outputs.version }}`

            Download `typx.pyz` for the current rolling build. `SHA256SUMS.txt`
            contains its SHA-256 checksum.
          files: |
            dist/typx.pyz
            dist/SHA256SUMS.txt
          overwrite_files: true
          fail_on_unmatched_files: true
          make_latest: true
